<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RED Tech — Gestão de Assistência Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/print.css">
<link rel="icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body>

<div class="app" id="app">

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <div class="brand-logo">RED</div>
        <div class="brand-text">
            <div class="brand-name">RED Tech</div>
            <div class="brand-sub">Gestão Técnica</div>
        </div>
    </div>

    <nav class="sidebar-nav">
        <div class="nav-section">Principal</div>
        <div class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
            <span class="nav-icon">📊</span>
            <span>Dashboard</span>
        </div>
        <div class="nav-item" data-page="jobs" onclick="navigateTo('jobs')">
            <span class="nav-icon">🔧</span>
            <span>Serviços</span>
            <span class="nav-badge" id="navJobCount">0</span>
        </div>
        <div class="nav-item" data-page="clients" onclick="navigateTo('clients')">
            <span class="nav-icon">👥</span>
            <span>Clientes</span>
            <span class="nav-badge" id="navClientCount">0</span>
        </div>

        <div class="nav-section">Financeiro</div>
        <div class="nav-item" data-page="finance" onclick="navigateTo('finance')">
            <span class="nav-icon">💰</span>
            <span>Financeiro</span>
        </div>

        <div class="nav-section">Sistema</div>
        <div class="nav-item" data-page="settings" onclick="navigateTo('settings')">
            <span class="nav-icon">⚙️</span>
            <span>Configurações</span>
        </div>
    </nav>

    <div class="sidebar-footer">
        <div class="kbd-hint">
            <span class="kbd">⌘K</span>
            <span>Paleta de comandos</span>
        </div>
        <div class="kbd-hint">
            <span class="kbd">⌘N</span>
            <span>Novo serviço</span>
        </div>
    </div>
</aside>

<!-- ═══════════════ MAIN ═══════════════ -->
<div class="main-area">

    <!-- Topbar -->
    <header class="topbar">
        <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>

        <div class="topbar-search" onclick="openPalette()">
            <span class="topbar-search-icon">🔍</span>
            <span class="topbar-search-text">Buscar...</span>
            <span class="topbar-search-kbd">⌘K</span>
        </div>

        <div class="topbar-actions">
            <button class="btn-topbar" onclick="exportAllData()" title="Exportar dados">💾</button>
            <button class="btn-topbar" onclick="document.getElementById('importFileInput').click()" title="Importar dados">📂</button>
        </div>
    </header>

    <!-- Content -->
    <div class="content" id="contentArea">
        <!-- Pages are rendered dynamically -->
    </div>

</div>
</div>

<!-- ═══════════════ COMMAND PALETTE ═══════════════ -->
<div class="palette-overlay" id="paletteOverlay" onclick="if(event.target===this)closePalette()">
    <div class="palette">
        <div class="palette-input-wrap">
            <span class="palette-input-icon">🔍</span>
            <input class="palette-input" id="paletteInput" placeholder="Comando ou busca..." oninput="filterPalette(this.value)">
        </div>
        <div class="palette-results" id="paletteResults"></div>
        <div class="palette-footer">
            <span><kbd>↑↓</kbd> navegar</span>
            <span><kbd>↵</kbd> selecionar</span>
            <span><kbd>esc</kbd> fechar</span>
        </div>
    </div>
</div>

<!-- ═══════════════ MODAL ═══════════════ -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalContent"></div>
</div>

<!-- ═══════════════ TOAST ═══════════════ -->
<div class="toast-container" id="toastContainer"></div>

<!-- Hidden import input -->
<input type="file" id="importFileInput" accept=".json" style="display:none" onchange="handleImport(event)">

<script src="js/data.js"></script>
<script src="js/helpers.js"></script>
<script src="js/storage.js"></script>
<script src="js/pages.js"></script>
<script src="js/modals.js"></script>
<script src="js/app.js"></script>
</body>
</html>
